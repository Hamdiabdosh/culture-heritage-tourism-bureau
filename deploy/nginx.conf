# Production-ish front: static SPA + /api → PHP.
# Used by docker compose `web` service (port 8088).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Upstream PHP API (docker compose service name).
    upstream egwp_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Hashed Vite assets — long cache.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Hero / other public static files.
        location /hero/ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        location = /robots.txt {
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        # Dynamic sitemap from PHP (absolute URLs via EGWP_PUBLIC_ORIGIN on API).
        location = /sitemap.xml {
            proxy_pass http://egwp_api/api/sitemap.xml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://egwp_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            # Session / CSRF cookies on same host.
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        # SPA shell — never long-cache index.html.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
