<VirtualHost *:80>
    DocumentRoot /var/www/backend/public

    <Directory /var/www/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Local: expose API at /api/* while DocumentRoot is backend/public
    Alias /api /var/www/backend/public
    <Directory /var/www/backend/public>
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/egwp-error.log
    CustomLog ${APACHE_LOG_DIR}/egwp-access.log combined
</VirtualHost>
